[project]
name = "astrbot-plugin-finance-agents"
version = "1.0.0"
description = "Multi-agent financial analysis for AstrBot: quant, news and X social sentiment with a folded CIO bull/bear verdict"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
# The plugin's own runtime dependencies. AstrBot (and its framework
# dependencies) is provided by the AstrBot process the plugin runs in.
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.0,<3",
    "aiohttp>=3.9,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]
